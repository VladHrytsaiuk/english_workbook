appId: com.vlad.englishworkbook
productName: EnglishWorkbook
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack: []
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64]
  identity: null
  icon: build/icon.png
dmg:
  title: EnglishWorkbook
  artifactName: EnglishWorkbook-${version}-${arch}.dmg
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: EnglishWorkbook-Setup-${version}.exe
portable:
  artifactName: EnglishWorkbook-${version}-portable.exe
